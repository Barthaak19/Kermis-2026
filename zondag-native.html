<style>

.timeline{margin-left:calc(var(--labelw) + var(--subw));width:calc(100% - var(--labelw) - var(--subw) - 40px);position:relative;height:82px;border-left:1px solid #333;border-right:1px solid #333}

.panel h2{margin:0 20px 10px} #weatherMeta{margin:0 20px 12px;color:#ddd} #weatherGrid{position:relative;height:180px;margin-left:calc(var(--labelw) + var(--subw));width:calc(100% - var(--labelw) - var(--subw) - 40px);background:#333;border-radius:10px;overflow:hidden}
.wcell{position:absolute;top:0;bottom:0;background:#f5f5f5;color:#111;text-align:center;padding:10px 4px;border-right:1px solid #ddd} .wtime{font-weight:900} .wicon{font-size:28px;margin:8px 0} .wtemp{font-size:24px;font-weight:900} .small{font-size:12px;margin-top:4px}

.pop{position:fixed;z-index:90;left:10px;right:10px;top:65px;max-height:55vh;overflow:auto;background:#111;color:white;border-radius:14px;padding:14px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.45)}

<script>
const START=14,END=26,HOURS=12,ACTS=[["Van Rooijen", "", "KONING", 20, 25.5], ["Het Café", "", "EDDIE Y LOS GRASOSOS", 18, 21], ["Het Café", "", "CARPET BURNS", 21, 25.5], ["Quicksilver", "BINNEN", "DJ TINO", 21, 26], ["Quicksilver", "BUITEN", "DJ JEROEN", 18, 22], ["Quicksilver", "BUITEN", "DJ JOOPY", 22, 25], ["'t Fortuin", "STRAAT", "JEROEN GMELICH", 16, 19.5], ["'t Fortuin", "STRAAT", "DJ CEES WEEL / DJ FERRY", 19.5, 25.5], ["'t Fortuin", "TENT", "ABBA EXPERIENCE", 17, 20], ["'t Fortuin", "TENT", "JADA BORSATO", 21, 22], ["'t Fortuin", "TENT", "JURRE JARING", 22, 23], ["'t Fortuin", "TENT", "BAS VAN SAAZE", 23, 25.5]],PAGE='zondag';
function pct(h){return((h-START)/(END-START))*100}
function fmt(h){let hh=Math.floor(h)%24,mm=Math.round((h-Math.floor(h))*60);return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')}
function favId(a){return PAGE+'|'+a[0]+'|'+a[1]+'|'+a[2]+'|'+a[3]}
function getFavs(){try{return JSON.parse(localStorage.getItem('kermis2026_favs')||'[]')}catch(e){return[]}}
function setFavs(v){localStorage.setItem('kermis2026_favs',JSON.stringify(v))}
function toast(t){
  const e=document.getElementById('toast');
  e.textContent=t;
  e.style.setProperty('display','block');
  e.style.setProperty('z-index','999999','important');
  e.style.setProperty('left','50%','important');
  e.style.setProperty('right','auto','important');
  e.style.setProperty('top','auto','important');
  e.style.setProperty('transform','translateX(-50%)','important');

  if(window.innerWidth < 1000){
    e.style.setProperty('bottom','calc(env(safe-area-inset-bottom, 0px) + 155px)','important');
  }else{
    e.style.setProperty('bottom','28px','important');
  }

  clearTimeout(window.tt);
  window.tt=setTimeout(()=>e.style.display='none',1500);
}
function buildTimeline(){const tl=document.getElementById('timeline');for(let i=0;i<=HOURS;i++){let l=document.createElement('div'),g=document.createElement('div'),left=(i/HOURS)*100;l.className='hourLabel';l.style.left=left+'%';l.textContent=fmt(START+i);g.className='hourLine';g.style.left=left+'%';tl.append(l,g)}}
function renderActs(){const favs=getFavs();document.querySelectorAll('.track[data-venue]').forEach(t=>t.innerHTML='');ACTS.forEach(a=>{const[venue,sub,name,start,end]=a;const track=[...document.querySelectorAll('.track[data-venue]')].find(t=>t.dataset.venue===venue&&t.dataset.sub===sub);if(!track)return;const b=document.createElement('div');b.className='act'+(favs.includes(favId(a))?' fav':'');b.style.left=pct(start)+'%';b.style.width=(pct(end)-pct(start))+'%';b.innerHTML=`<span>${name}</span><span class="star">★</span>`;b.addEventListener('click',()=>{let f=getFavs(),id=favId(a),i=f.indexOf(id),added=i<0;if(added)f.push(id);else f.splice(i,1);setFavs(f);renderActs();toast((added?'⭐ Favoriet: ':'☆ Verwijderd: ')+name)});track.appendChild(b)})}
function currentHour(){const n=new Date();let h=n.getHours()+n.getMinutes()/60+n.getSeconds()/3600;if(n.getHours()<3)h+=24;return h}
function updateNowLine(){const h=currentHour(),c=Math.max(START,Math.min(END,h)),tl=document.getElementById('timeline'),left=tl.offsetLeft+(c-START)/(END-START)*tl.clientWidth;document.getElementById('nowLine').style.left=left+'px';document.getElementById('nowBubble').style.left=left+'px';document.getElementById('nowBubble').textContent=new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}
function showFavs(){const p=document.getElementById('favPanel'),f=getFavs(),arr=ACTS.filter(a=>f.includes(favId(a)));p.innerHTML='<h3>⭐ Favorieten</h3>'+(arr.length?arr.map(a=>`<div class="item"><b>${a[2]}</b> — ${a[0]} ${a[1]} · ${fmt(a[3])}–${fmt(a[4])}</div>`).join(''):'<div class="item">Nog geen favorieten.</div>');p.style.display='block';document.getElementById('nowPanel').style.display='none'}
function showNow(){const p=document.getElementById('nowPanel'),h=currentHour(),now=ACTS.filter(a=>a[3]<=h&&h<a[4]),soon=ACTS.filter(a=>a[3]>h&&a[3]<=h+1).sort((a,b)=>a[3]-b[3]);p.innerHTML='<h3>🔴 NU</h3>'+(now.length?now.map(a=>`<div class="item"><b>${a[2]}</b> — ${a[0]} ${a[1]}</div>`).join(''):'<div class="item">Nu niets gepland.</div>')+'<h3>⏭ STRAKS</h3>'+(soon.length?soon.map(a=>`<div class="item"><b>${a[2]}</b> — ${fmt(a[3])}</div>`).join(''):'<div class="item">Binnen een uur niets nieuws.</div>');p.style.display='block';document.getElementById('favPanel').style.display='none'}
function icon(c){if([0,1].includes(c))return'☀️';if(c===2)return'🌤️';if([3,45,48].includes(c))return'☁️';if([51,53,55,61,63,65,80,81,82].includes(c))return'🌧️';if([95,96,99].includes(c))return'⛈️';return'🌥️'}
async function weather(){try{const url='https://api.open-meteo.com/v1/forecast?latitude=52.73&longitude=5.16&hourly=temperature_2m,precipitation,precipitation_probability,weather_code,wind_speed_10m,wind_gusts_10m&timezone=Europe%2FAmsterdam&start_date=2026-08-16&end_date=2026-08-17';const r=await fetch(url,{cache:'no-store'}),d=await r.json();let html='';for(let h=14;h<26;h++){const date=h<24?'2026-08-16':'2026-08-17',key=date+'T'+String(h%24).padStart(2,'0')+':00',i=d.hourly.time.indexOf(key);html+=`<div class=\"wcell\" style=\"left:${((h-14)/12)*100}%;width:${100/12}%\"><div class=\"wtime\">${fmt(h)}</div><div class="wicon">${icon(d.hourly.weather_code[i])}</div><div class="wtemp">${Math.round(d.hourly.temperature_2m[i])}°</div><div class="small">💧 ${d.hourly.precipitation[i]} mm · ${d.hourly.precipitation_probability[i]}%</div><div class="small">↗ ${Math.round(d.hourly.wind_speed_10m[i])} km/u</div><div class="small">vlaag ${Math.round(d.hourly.wind_gusts_10m[i])}</div></div>`}document.getElementById('weatherGrid').innerHTML=html;document.getElementById('weatherMeta').textContent='Zondag 16 augustus · laatst ververst '+new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}catch(e){document.getElementById('weatherMeta').textContent='Live weer tijdelijk niet beschikbaar'}}
async function rainAlert(){try{const u='https://api.open-meteo.com/v1/forecast?latitude=52.73&longitude=5.16&hourly=precipitation_probability,precipitation&timezone=Europe%2FAmsterdam&forecast_days=2',r=await fetch(u,{cache:'no-store'}),d=await r.json(),n=new Date();let best=null;for(let i=0;i<d.hourly.time.length;i++){const t=new Date(d.hourly.time[i]),diff=(t-n)/3600000;if(diff>=0&&diff<=3&&(d.hourly.precipitation_probability[i]>=50||d.hourly.precipitation[i]>=.2)){best={t,p:d.hourly.precipitation_probability[i],mm:d.hourly.precipitation[i]};break}}const e=document.getElementById('rainAlert');if(best){e.textContent=`🌧️ Regenkans rond ${best.t.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}: ${best.p}% · ${best.mm} mm`;e.style.display='block'}else e.style.display='none'}catch(e){}}
buildTimeline();renderActs();updateNowLine();weather();rainAlert();setInterval(updateNowLine,1000);setInterval(weather,10*60*1000);setInterval(rainAlert,15*60*1000);window.addEventListener('resize',updateNowLine);


/* --- ULTRA SMOOTH MOBIELE ZOOM/PAN --- */
const zoomViewport=document.getElementById('zoomViewport');
const zoomSheet=document.getElementById('sheet');

let zMin=1,zMax=6;
let zScale=1,zX=0,zY=0;
let targetScale=1,targetX=0,targetY=0;

const activePointers=new Map();
let gesture=null;
let rafId=0;
let suppressClickUntil=0;

function insideZoomViewport(target){
  return target && (target===zoomViewport || zoomViewport.contains(target));
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function mid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}

function clampTarget(){
  if(window.innerWidth>=1000)return;
  const vw=zoomViewport.clientWidth,vh=zoomViewport.clientHeight;
  const sw=zoomSheet.offsetWidth*targetScale;
  const sh=zoomSheet.offsetHeight*targetScale;

  if(sw<=vw) targetX=(vw-sw)/2;
  else targetX=Math.min(0,Math.max(vw-sw,targetX));

  if(sh<=vh) targetY=0;
  else targetY=Math.min(0,Math.max(vh-sh,targetY));
}

function startRenderLoop(){
  if(rafId)return;
  const tick=()=>{
    rafId=0;

    // zachte low-pass smoothing: snel genoeg om direct te voelen,
    // maar traag genoeg om touch-jitter eruit te halen.
    const k=0.34;
    zScale += (targetScale-zScale)*k;
    zX += (targetX-zX)*k;
    zY += (targetY-zY)*k;

    if(Math.abs(targetScale-zScale)<0.0004) zScale=targetScale;
    if(Math.abs(targetX-zX)<0.08) zX=targetX;
    if(Math.abs(targetY-zY)<0.08) zY=targetY;

    zoomSheet.style.transform=`translate3d(${zX.toFixed(2)}px,${zY.toFixed(2)}px,0) scale(${zScale.toFixed(4)})`;

    if(Math.abs(targetScale-zScale)>0.0004 ||
       Math.abs(targetX-zX)>0.08 ||
       Math.abs(targetY-zY)>0.08){
      rafId=requestAnimationFrame(tick);
    }
  };
  rafId=requestAnimationFrame(tick);
}

function setTarget(scale,x,y){
  targetScale=Math.max(zMin,Math.min(zMax,scale));
  targetX=x; targetY=y;
  clampTarget();
  startRenderLoop();
}

function fitOverview(){
  const tb=document.getElementById('topbar');

  if(window.innerWidth>=1000){
    zoomViewport.style.top='auto';
    zoomSheet.style.transform='none';
    zMin=zScale=targetScale=1;
    zX=zY=targetX=targetY=0;
    return;
  }

  zoomViewport.style.top=(tb?tb.offsetHeight:0)+'px';

  const vw=zoomViewport.clientWidth,vh=zoomViewport.clientHeight;
  const sw=zoomSheet.offsetWidth,sh=zoomSheet.offsetHeight;
  zMin=Math.min(vw/sw,vh/sh);

  zScale=targetScale=zMin;
  zX=targetX=(vw-sw*zMin)/2;
  zY=targetY=0;
  zoomSheet.style.transform=`translate3d(${zX}px,0,0) scale(${zScale})`;
}

function zoomAround(cx,cy,newScale){
  newScale=Math.max(zMin,Math.min(zMax,newScale));
  const ix=(cx-targetX)/targetScale;
  const iy=(cy-targetY)/targetScale;
  setTarget(newScale,cx-ix*newScale,cy-iy*newScale);
}

/* Capture-fase op document: hierdoor werkt pinch ook als beide vingers
   rechtstreeks op optredenblokken staan. */
document.addEventListener('pointerdown',e=>{
  if(window.innerWidth>=1000 || !insideZoomViewport(e.target))return;
  if(e.pointerType==='mouse' && e.button!==0)return;

  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(activePointers.size===1){
    gesture={
      type:'pan',
      sx:e.clientX, sy:e.clientY,
      bx:targetX, by:targetY,
      moved:false,
      onAct:!!(e.target.closest && e.target.closest('.act'))
    };
  }else if(activePointers.size===2){
    const p=[...activePointers.values()];
    const m=mid(p[0],p[1]);
    gesture={
      type:'pinch',
      startDist:Math.max(1,dist(p[0],p[1])),
      baseScale:targetScale,
      imageX:(m.x-targetX)/targetScale,
      imageY:(m.y-targetY)/targetScale,
      filteredMidX:m.x,
      filteredMidY:m.y,
      moved:true
    };
  }
},true);

document.addEventListener('pointermove',e=>{
  if(window.innerWidth>=1000 || !activePointers.has(e.pointerId))return;
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(activePointers.size===2){
    e.preventDefault();
    const p=[...activePointers.values()];
    const m=mid(p[0],p[1]);
    const d=Math.max(1,dist(p[0],p[1]));

    if(!gesture || gesture.type!=='pinch'){
      gesture={
        type:'pinch',
        startDist:d,
        baseScale:targetScale,
        imageX:(m.x-targetX)/targetScale,
        imageY:(m.y-targetY)/targetScale,
        filteredMidX:m.x,
        filteredMidY:m.y,
        moved:true
      };
      return;
    }

    // Filter ook het middelpunt van de twee vingers; dit haalt
    // het heen-en-weer springen bij kleine handbewegingen eruit.
    gesture.filteredMidX += (m.x-gesture.filteredMidX)*0.42;
    gesture.filteredMidY += (m.y-gesture.filteredMidY)*0.42;

    const rawScale=gesture.baseScale*(d/gesture.startDist);
    const ns=Math.max(zMin,Math.min(zMax,rawScale));

    setTarget(
      ns,
      gesture.filteredMidX-gesture.imageX*ns,
      gesture.filteredMidY-gesture.imageY*ns
    );
    return;
  }

  if(activePointers.size===1 && gesture && gesture.type==='pan'){
    const p=[...activePointers.values()][0];
    const dx=p.x-gesture.sx,dy=p.y-gesture.sy;
    if(Math.hypot(dx,dy)>7)gesture.moved=true;

    if(gesture.moved && targetScale>zMin+0.001){
      e.preventDefault();
      setTarget(targetScale,gesture.bx+dx,gesture.by+dy);
    }
  }
},{capture:true,passive:false});

function pointerEnd(e){
  if(!activePointers.has(e.pointerId))return;

  const moved=!!(gesture&&gesture.moved);
  const onAct=!!(gesture&&gesture.onAct);
  activePointers.delete(e.pointerId);

  if(moved&&onAct)suppressClickUntil=Date.now()+650;

  if(activePointers.size===1){
    const p=[...activePointers.values()][0];
    gesture={
      type:'pan',
      sx:p.x,sy:p.y,
      bx:targetX,by:targetY,
      moved:false,onAct:false
    };
  }else if(activePointers.size===0){
    gesture=null;
  }
}
document.addEventListener('pointerup',pointerEnd,true);
document.addEventListener('pointercancel',pointerEnd,true);

document.addEventListener('click',e=>{
  if(Date.now()<suppressClickUntil && e.target.closest && e.target.closest('.act')){
    e.preventDefault();
    e.stopImmediatePropagation();
  }
},true);

function mobileZoomIn(){
  if(window.innerWidth>=1000)return;
  zoomAround(zoomViewport.clientWidth/2,zoomViewport.clientHeight/2,targetScale*1.28);
}
function mobileZoomOut(){
  if(window.innerWidth>=1000)return;
  zoomAround(zoomViewport.clientWidth/2,zoomViewport.clientHeight/2,targetScale/1.28);
}
function mobileZoomReset(){
  if(window.innerWidth>=1000)return;
  fitOverview();
}

zoomViewport.addEventListener('dblclick',e=>{
  if(window.innerWidth>=1000)return;
  if(targetScale>zMin*1.15) fitOverview();
  else zoomAround(e.clientX,e.clientY,Math.min(zMin*2.1,2.3));
});

function toggleFavPanel(){
  const p=document.getElementById('favPanel');
  const open=p.style.display==='block'||getComputedStyle(p).display==='block';
  if(open){p.style.display='none';return;}
  showFavs();
}
function toggleNowPanel(){
  const p=document.getElementById('nowPanel');
  const open=p.style.display==='block'||getComputedStyle(p).display==='block';
  if(open){p.style.display='none';return;}
  showNow();
}

window.addEventListener('resize',()=>requestAnimationFrame(fitOverview));
setTimeout(fitOverview,100);

</script>

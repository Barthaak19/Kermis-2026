<script>
if ('serviceWorker' in navigator) {
  let reloadingForUpdate = false;

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloadingForUpdate) return;
    reloadingForUpdate = true;
    window.location.reload();
  });

  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register(
        '/Kermis-2026/service-worker.js',
        { scope: '/Kermis-2026/', updateViaCache: 'none' }
      );

      // Meteen controleren of GitHub een nieuwere versie heeft.
      reg.update();

      // Als er al een nieuwe worker wacht, activeer die direct.
      if (reg.waiting) {
        reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      }

      reg.addEventListener('updatefound', () => {
        const worker = reg.installing;
        if (!worker) return;
        worker.addEventListener('statechange', () => {
          if (worker.state === 'installed' && navigator.serviceWorker.controller) {
            // De service worker gebruikt skipWaiting(), dus controllerchange volgt vanzelf.
          }
        });
      });

      // Controleer opnieuw zodra de gebruiker terugkeert naar de app.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.update();
      });
      window.addEventListener('focus', () => reg.update());
    } catch (err) {
      console.error('Service worker fout', err);
    }
  });
}
</script>
